name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Build APK with Verbose Log
        run: |
          cd wangwang_phone
          flutter pub get
          flutter build apk --release --no-tree-shake-icons -v

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WangWangPhone-Release-APK
          path: wangwang_phone/build/app/outputs/flutter-apk/*.apk
